{{ define "main" }}
<div class="hero">
    <div class="hero__image">
        <div class="carousel">
            <div class="carousel__item active">
                <img src="/images/Jim.jpg" alt="Jim" class="carousel__image">
                <div class="carousel__caption">Ready for my yoga retreat</div>
            </div>
            <div class="carousel__item">
                <img src="/images/try.jpeg" alt="Fuzzy Fur Feet" class="carousel__image">
                <div class="carousel__caption">Corporate try-hard athlon</div>
            </div>
            <div class="carousel__item">
                <img src="/images/cgo_talk.jpg" alt="CGO Talk" class="carousel__image">
                <div class="carousel__caption">Speeching at Golang Meetup in Melbourne</div>
            </div>
        </div>
    </div>
    <div class="hero__content">
        <h1>{{ .Title }}</h1>
        <p>{{ .Site.Params.description }}</p>
        <div class="hero__text">
            {{ .Content }}
        </div>
    </div>
</div>
<script>
let currentSlide = 0;
const slides = document.querySelectorAll('.carousel__item');

function showSlide(n) {
    slides.forEach(slide => slide.classList.remove('active'));
    currentSlide = (n + slides.length) % slides.length;
    slides[currentSlide].classList.add('active');
}

setInterval(() => showSlide(currentSlide + 1), 4000);
</script>
{{ end }}
